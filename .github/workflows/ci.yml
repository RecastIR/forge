name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new PR revision supersedes the active run. Manual reruns wait their turn.
concurrency:
  group: forge-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '3'
  FORGE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  macos-dev:
    runs-on: macos-26
    outputs:
      stages: ${{ steps.native.outputs.stages }}
      release_forge: ${{ steps.native.outputs.sha256 }}
      executable_inputs_sha256: ${{ steps.executables.outputs.sha256 }}
      termination_sha256: ${{ steps.termination.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: native
        uses: ./.github/actions/native-test
        with:
          preset: dev
      - name: Package the PE files exercised by the native executable tests
        id: executables
        working-directory: build/dev/fixtures/Debug
        run: |
          list="$GITHUB_WORKSPACE/tests/differential/reference/executable-inputs.txt"
          dest="$RUNNER_TEMP/executable-inputs"
          mkdir "$dest"
          while IFS= read -r pe; do cp "$pe" "$dest/"; done < "$list"
          xargs shasum -a 256 < "$list" > "$dest/SHA256SUMS"
          echo "sha256=$(shasum -a 256 "$dest/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: executable-reference-inputs
          path: ${{ runner.temp }}/executable-inputs
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Package focused Windows reference inputs when compatibility changes
        id: termination
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git diff --name-only "$BASE" HEAD | grep -E '(^tests/(fixtures/(crt-termination|generate.py|executable-startup-info)|differential/reference/termination/)|^runtime/src/compat/(crt/termination|win32/startup_info)|^\.github/workflows/ci\.yml$)' >/dev/null; then
            exit 0
          fi
          list="$PWD/tests/differential/reference/termination/inputs.txt"
          dest="$RUNNER_TEMP/termination-inputs"
          mkdir "$dest"
          cd build/dev/fixtures/Debug
          while IFS= read -r pe; do cp "$pe" "$dest/"; done < "$list"
          xargs shasum -a 256 < "$list" > "$dest/SHA256SUMS"
          echo "sha256=$(shasum -a 256 "$dest/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.termination.outputs.sha256 != ''
        with:
          name: termination-inputs
          path: ${{ runner.temp }}/termination-inputs
          if-no-files-found: error

  legacy-windows-capture:
    needs: macos-dev
    if: needs.macos-dev.outputs.termination_sha256 != ''
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: termination-inputs
          path: inputs
      - name: Measure legacy system MSVCRT and startup information
        run: python -B tests/differential/reference/termination/observe.py inputs observations --manifest-sha256 ${{ needs.macos-dev.outputs.termination_sha256 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-windows-observations
          path: observations
          if-no-files-found: error

  macos-sanitize:
    runs-on: macos-26
    outputs:
      stages: ${{ steps.native.outputs.stages }}
      debug_forge: ${{ steps.native.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: native
        uses: ./.github/actions/native-test
        with:
          preset: sanitize

  macos-presets:
    runs-on: macos-26
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-setup
        with:
          presets: release lint xcode
      - name: Check formatting, lint, Release and Xcode presets offline
        id: verify
        env:
          FORGE_STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-presets
      - name: Preserve failed preset configuration and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-presets
          path: |
            build/*/Testing/Temporary/*.log
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  windows-fixtures:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify host and runner contracts
        run: |
          test "$(uname -m)" = x86_64
          python3 -B tests/differential/test_manifests.py
          python3 -B tests/differential/reference/test_runner.py
          python3 -B tests/differential/test_differential.py
          python3 -B tests/differential/test_coverage.py
      - name: Prepare the pinned MinGW and Wine images
        run: make provision-fixtures
      - name: Build reproducible PEs, capture references, and verify Wine boundaries
        id: verify
        run: ./tools/test-forge.sh --references
      - name: Transfer matching validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-inputs
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64/wine
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Preserve incomplete producer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  windows-executable-reference:
    needs: macos-dev
    runs-on: ubuntu-24.04
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
      executable_inputs_sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: executable-reference-inputs
          path: build/dev/fixtures/Debug
      - name: Verify the native-tested PE set and checksums
        id: inputs
        working-directory: build/dev/fixtures/Debug
        env:
          EXPECTED_SHA256: ${{ needs.macos-dev.outputs.executable_inputs_sha256 }}
        run: |
          list="$GITHUB_WORKSPACE/tests/differential/reference/executable-inputs.txt"
          find . -mindepth 1 -maxdepth 1 ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | diff -u "$list" -
          xargs sha256sum < "$list" | cmp - SHA256SUMS
          echo "$EXPECTED_SHA256  SHA256SUMS" | sha256sum --strict --check -
          echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare the pinned Wine image
        run: make provision-fixtures
      - name: Capture standalone PE behavior on Linux amd64
        id: verify
        run: |
          test "$(uname -m)" = x86_64
          ./tools/test-forge.sh --executable-reference

  differential:
    outputs:
      evidence_run_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      stages: ${{ toJSON(steps.verify.outputs) }}
    needs: [macos-dev, macos-sanitize, windows-fixtures]
    env:
      FORGE_DIFF_JOBS: '4'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/llvm
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-macos-arm64-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested
      - name: Extract and verify the tested Forge executables and contract helpers
        env:
          DEV_SHA256: ${{ needs.macos-dev.outputs.release_forge }}
          SANITIZE_SHA256: ${{ needs.macos-sanitize.outputs.debug_forge }}
        run: |
          for preset in dev sanitize; do
            tar -xzf "$RUNNER_TEMP/tested/tested-$preset.tgz"
            for executable in forge tests/recovery_contract tests/lift_contract; do
              artifact="build/$preset/$executable"
              test -f "$artifact" && test -x "$artifact" || { echo "Missing or non-executable tested artifact: $artifact" >&2; exit 1; }
            done
          done
          echo "$DEV_SHA256  build/dev/forge" | shasum -a 256 -c -
          echo "$SANITIZE_SHA256  build/sanitize/forge" | shasum -a 256 -c -
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-inputs
          path: build
      - name: Compare both configurations and exercise failure paths
        id: verify
        run: ./tools/test-forge.sh --differential
      - name: Preserve case evidence and native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-differential
          path: |
            build/differential/**/result.json
            build/differential/**/suite.json
            build/differential/**/inspect.json
            build/differential/**/analysis.json
            build/differential/**/inspect.log
            build/differential/**/analysis.log
            build/differential/**/lifting.log
            build/differential/**/lifting.stdout
            build/differential/**/configuration.log
            build/differential/**/compilation.log
            build/differential/**/generated/*.ll
            build/differential/**/native/tests/optimized.ll
            build/differential/**/native/bin/differential_*
            build/differential/**/stdout.bin
            build/differential/**/stderr.bin
            !build/differential/reference/**
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  regression-gate:
    if: ${{ always() }}
    needs: [macos-dev, macos-sanitize, macos-presets, windows-fixtures, windows-executable-reference, differential]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.windows-fixtures.result == 'success' }}
        with:
          name: windows-x64-inputs
          path: build
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && (needs.differential.result == 'success' || needs.differential.result == 'failure') }}
        with:
          name: macos-arm64-differential
          path: build/differential
      - name: Reconcile required executions with observed behavior
        if: ${{ always() }}
        env:
          JOBS: ${{ toJSON(needs) }}
        run: python3 -B tests/differential/coverage_report.py --jobs "$JOBS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: regression-coverage
          path: build/differential/coverage/coverage.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Link diagnostic artifacts
        if: ${{ always() }}
        run: echo "[Run logs and downloadable artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
