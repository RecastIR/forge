name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new PR revision supersedes the active run. Manual reruns wait their turn.
concurrency:
  group: forge-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '3'
  FORGE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  macos-dev:
    runs-on: macos-26
    outputs:
      stages: ${{ steps.native.outputs.stages }}
      release_forge: ${{ steps.native.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: native
        uses: ./.github/actions/native-test
        with:
          preset: dev

  macos-sanitize:
    runs-on: macos-26
    outputs:
      stages: ${{ steps.native.outputs.stages }}
      debug_forge: ${{ steps.native.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: native
        uses: ./.github/actions/native-test
        with:
          preset: sanitize

  macos-presets:
    runs-on: macos-26
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-setup
        with:
          presets: release lint xcode
      - name: Check formatting, lint, Release and Xcode presets offline
        id: verify
        env:
          FORGE_STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-presets
      - name: Preserve failed preset configuration and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-presets
          path: |
            build/*/Testing/Temporary/*.log
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  windows-fixtures:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify host and runner contracts
        run: |
          test "$(uname -m)" = x86_64
          python3 -B tests/differential/test_manifests.py
          python3 -B tests/differential/reference/test_runner.py
          python3 -B tests/differential/test_differential.py
          python3 -B tests/differential/test_coverage.py
      - name: Prepare the pinned MinGW and Wine images
        run: make provision-fixtures
      - name: Build reproducible PEs, capture references, and verify Wine boundaries
        id: verify
        run: ./tools/test-forge.sh --references
      - name: Transfer matching validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-inputs
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64/wine
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Preserve incomplete producer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  differential:
    outputs:
      evidence_run_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      stages: ${{ toJSON(steps.verify.outputs) }}
    needs: [macos-dev, macos-sanitize, windows-fixtures]
    env:
      FORGE_DIFF_JOBS: '4'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/llvm
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-macos-arm64-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested
      - name: Extract and verify the tested Forge executables
        env:
          DEV_SHA256: ${{ needs.macos-dev.outputs.release_forge }}
          SANITIZE_SHA256: ${{ needs.macos-sanitize.outputs.debug_forge }}
        run: |
          for preset in dev sanitize; do tar -xzf "$RUNNER_TEMP/tested/tested-$preset.tgz"; done
          echo "$DEV_SHA256  build/dev/forge" | shasum -a 256 -c -
          echo "$SANITIZE_SHA256  build/sanitize/forge" | shasum -a 256 -c -
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-inputs
          path: build
      - name: Compare both configurations and exercise failure paths
        id: verify
        run: ./tools/test-forge.sh --differential
      - name: Preserve case evidence and native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-differential
          path: |
            build/differential/**/result.json
            build/differential/**/suite.json
            build/differential/**/inspect.json
            build/differential/**/analysis.json
            build/differential/**/inspect.log
            build/differential/**/analysis.log
            build/differential/**/lifting.log
            build/differential/**/lifting.stdout
            build/differential/**/configuration.log
            build/differential/**/compilation.log
            build/differential/**/generated/*.ll
            build/differential/**/native/tests/optimized.ll
            build/differential/**/native/bin/differential_*
            build/differential/**/stdout.bin
            build/differential/**/stderr.bin
            !build/differential/reference/**
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  regression-gate:
    if: ${{ always() }}
    needs: [macos-dev, macos-sanitize, macos-presets, windows-fixtures, differential]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.windows-fixtures.result == 'success' }}
        with:
          name: windows-x64-inputs
          path: build
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && (needs.differential.result == 'success' || needs.differential.result == 'failure') }}
        with:
          name: macos-arm64-differential
          path: build/differential
      - name: Reconcile required executions with observed behavior
        if: ${{ always() }}
        env:
          JOBS: ${{ toJSON(needs) }}
        run: python3 -B tests/differential/coverage_report.py --jobs "$JOBS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: regression-coverage
          path: build/differential/coverage/coverage.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Link diagnostic artifacts
        if: ${{ always() }}
        run: echo "[Run logs and downloadable artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
