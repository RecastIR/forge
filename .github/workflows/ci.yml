name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORGE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  macos:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
      debug_forge: ${{ steps.package.outputs.debug }}
      release_forge: ${{ steps.package.outputs.release }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unicorn-wheels
          key: unicorn-2.1.4-macos-arm64-python3.12-v1
      - uses: ./.github/actions/llvm
      - name: Set up the function oracle
        run: |
          brew install python@3.12
          venv="$RUNNER_TEMP/forge-python"
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$venv"
          wheels="$RUNNER_TEMP/unicorn-wheels"
          "$venv/bin/python" -m pip download --no-deps --only-binary=:all: --dest "$wheels" unicorn==2.1.4
          "$venv/bin/python" -m pip install --no-index --find-links "$wheels" unicorn==2.1.4
          echo "CMAKE_ARGS=-DPython3_EXECUTABLE=$venv/bin/python" >> "$GITHUB_ENV"
      - name: Check formatting, lint, Debug CTest, and sanitizer CTest
        id: verify
        env:
          FORGE_STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/test-forge.sh --native
      - name: Package the tested Forge executables
        id: package
        run: |
          tar -czf tested-forge.tgz build/forge build-sanitize/forge
          shasum -a 256 build-sanitize/forge | awk '{print "debug=" $1}' >> "$GITHUB_OUTPUT"
          shasum -a 256 build/forge | awk '{print "release=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-macos-arm64-forge
          path: tested-forge.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  windows-fixtures:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify host and runner contracts
        run: |
          test "$(uname -m)" = x86_64
          python3 -B tests/differential/test_manifests.py
          python3 -B tests/differential/reference/test_runner.py
          python3 -B tests/differential/test_differential.py
          python3 -B tests/differential/test_coverage.py
      - name: Build reproducible PEs, capture references, and verify Wine boundaries
        id: verify
        run: ./tools/test-forge.sh --references
      - name: Transfer matching validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-inputs
          path: |
            build/fixtures/windows-x64
            build/reference/windows-x64/wine
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Preserve incomplete producer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/fixtures/windows-x64
            build/reference/windows-x64
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  differential:
    outputs:
      evidence_run_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      stages: ${{ toJSON(steps.verify.outputs) }}
    needs: [macos, windows-fixtures]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/llvm
      - uses: actions/download-artifact@v4
        with:
          name: tested-macos-arm64-forge
      - run: tar -xzf tested-forge.tgz
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-inputs
          path: build
      - name: Compare both configurations and exercise failure paths
        id: verify
        run: ./tools/test-forge.sh --differential
      - name: Preserve case evidence and native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-differential
          path: |
            build/differential/**/result.json
            build/differential/**/suite.json
            build/differential/**/inspect.json
            build/differential/**/analysis.json
            build/differential/**/inspect.log
            build/differential/**/analysis.log
            build/differential/**/lifting.log
            build/differential/**/compilation.log
            build/differential/**/generated/*.ll
            build/differential/**/native/tests/optimized.ll
            build/differential/**/native/bin/differential_*
            build/differential/**/stdout.bin
            build/differential/**/stderr.bin
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  regression-gate:
    if: ${{ always() }}
    needs: [macos, windows-fixtures, differential]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.windows-fixtures.result == 'success' }}
        with:
          name: windows-x64-inputs
          path: build
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && (needs.differential.result == 'success' || needs.differential.result == 'failure') }}
        with:
          name: macos-arm64-differential
          path: build/differential
      - name: Reconcile required executions with observed behavior
        if: ${{ always() }}
        env:
          JOBS: ${{ toJSON(needs) }}
          FORGE_TEST_RUN_ID: ${{ needs.differential.outputs.evidence_run_id || env.FORGE_TEST_RUN_ID }}
        run: python3 -B tests/differential/coverage_report.py --jobs "$JOBS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: regression-coverage
          path: build/coverage/coverage.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Link diagnostic artifacts
        if: ${{ always() }}
        run: echo "[Run logs and downloadable artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
