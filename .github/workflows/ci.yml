name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORGE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

jobs:
  macos:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
      debug_forge: ${{ steps.package.outputs.debug }}
      release_forge: ${{ steps.package.outputs.release }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/llvm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install the pinned build tools and function oracle
        run: |
          venv="$RUNNER_TEMP/forge-python"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --only-binary=unicorn -r requirements-build.txt
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "CMAKE_ARGS=-DPython3_EXECUTABLE=$venv/bin/python" >> "$GITHUB_ENV"
          echo "CONAN_HOME=$RUNNER_TEMP/forge-conan" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: packages
        with:
          path: ${{ runner.temp }}/forge-packages.tgz
          key: forge-conan-macos26-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/**', 'requirements-build.txt', 'CMakePresets.json') }}
      - name: Provision the locked dependencies
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then conan cache restore "$RUNNER_TEMP/forge-packages.tgz"; fi
          for preset in dev release sanitize lint xcode; do make provision PRESET="$preset"; done
          if [[ "$CACHE_HIT" != true ]]; then
            conan cache save '*:*' --no-source --file "$RUNNER_TEMP/forge-packages.tgz"
          fi
      - name: Check formatting, lint, Debug CTest, and sanitizer CTest
        id: verify
        env:
          FORGE_STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native
      - name: Exercise Release and Xcode presets
        run: |
          for preset in release xcode; do
            make test PRESET="$preset" CTEST_ARGS="-R ^cli$"
          done
      - name: Check the build layout and source tree
        run: |
          test ! -f build/CMakeCache.txt
          test -z "$(find . -maxdepth 1 -type d -name 'build-*' -print)"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Package the tested Forge executables
        id: package
        run: |
          tar -czf "$RUNNER_TEMP/tested-forge.tgz" build/dev/forge build/sanitize/forge
          shasum -a 256 build/sanitize/forge | awk '{print "debug=" $1}' >> "$GITHUB_OUTPUT"
          shasum -a 256 build/dev/forge | awk '{print "release=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-macos-arm64-forge
          path: ${{ runner.temp }}/tested-forge.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Preserve failed native configuration and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics
          path: |
            build/*/required-tests.xml
            build/*/Testing/Temporary/*.log
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  windows-fixtures:
    outputs:
      stages: ${{ toJSON(steps.verify.outputs) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify host and runner contracts
        run: |
          test "$(uname -m)" = x86_64
          python3 -B tests/differential/test_manifests.py
          python3 -B tests/differential/reference/test_runner.py
          python3 -B tests/differential/test_differential.py
          python3 -B tests/differential/test_coverage.py
      - name: Prepare the pinned MinGW and Wine images
        run: make provision-fixtures
      - name: Build reproducible PEs, capture references, and verify Wine boundaries
        id: verify
        run: ./tools/test-forge.sh --references
      - name: Transfer matching validated inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-inputs
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64/wine
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Preserve incomplete producer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            build/fixtures/windows-x64
            build/differential/reference/windows-x64
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  differential:
    outputs:
      evidence_run_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      stages: ${{ toJSON(steps.verify.outputs) }}
    needs: [macos, windows-fixtures]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/llvm
      - uses: actions/download-artifact@v4
        with:
          name: tested-macos-arm64-forge
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/tested-forge.tgz"
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-inputs
          path: build
      - name: Compare both configurations and exercise failure paths
        id: verify
        run: ./tools/test-forge.sh --differential
      - name: Preserve case evidence and native diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-differential
          path: |
            build/differential/**/result.json
            build/differential/**/suite.json
            build/differential/**/inspect.json
            build/differential/**/analysis.json
            build/differential/**/inspect.log
            build/differential/**/analysis.log
            build/differential/**/lifting.log
            build/differential/**/lifting.stdout
            build/differential/**/compilation.log
            build/differential/**/generated/*.ll
            build/differential/**/native/tests/optimized.ll
            build/differential/**/native/bin/differential_*
            build/differential/**/stdout.bin
            build/differential/**/stderr.bin
            !build/differential/reference/**
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  regression-gate:
    if: ${{ always() }}
    needs: [macos, windows-fixtures, differential]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.windows-fixtures.result == 'success' }}
        with:
          name: windows-x64-inputs
          path: build
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && (needs.differential.result == 'success' || needs.differential.result == 'failure') }}
        with:
          name: macos-arm64-differential
          path: build/differential
      - name: Reconcile required executions with observed behavior
        if: ${{ always() }}
        env:
          JOBS: ${{ toJSON(needs) }}
          FORGE_TEST_RUN_ID: ${{ needs.differential.outputs.evidence_run_id || env.FORGE_TEST_RUN_ID }}
        run: python3 -B tests/differential/coverage_report.py --jobs "$JOBS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: regression-coverage
          path: build/differential/coverage/coverage.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Link diagnostic artifacts
        if: ${{ always() }}
        run: echo "[Run logs and downloadable artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
