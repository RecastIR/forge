name: Forge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifests and reference runner
        run: |
          test "$(uname -m)" = x86_64
          python3 -B tests/differential/manifests.py
          python3 -B tests/differential/test_manifests.py
          python3 -B tests/differential/reference/test_runner.py
          python3 -B tests/differential/test_differential.py
      - name: Build and verify Windows x64 fixtures
        run: ./tools/build-windows-fixtures.sh --all
      - name: Capture Wine references
        run: ./tools/run-windows-references.sh --all
      - name: Verify reference artifacts and Wine capture boundaries
        run: python3 -B tests/differential/reference/test_wine.py
      - name: Upload validated Wine references
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-wine-references
          path: build/reference/windows-x64/wine
          if-no-files-found: error
      - name: Upload matching PE exports and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-fixtures
          path: build/fixtures/windows-x64
          if-no-files-found: error

  macos:
    needs: windows-fixtures
    if: ${{ !cancelled() }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Set up LLVM and the function oracle
        run: |
          brew install llvm@17 python@3.12
          llvm_config="$(brew --prefix llvm@17)/bin/llvm-config"
          test "$("$llvm_config" --version)" = 17.0.6
          test "$(uname -m)" = arm64
          venv="$RUNNER_TEMP/forge-python"
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$venv"
          "$venv/bin/python" -m pip install --only-binary=:all: unicorn==2.1.4
          "$venv/bin/python" -c 'import unicorn'
          {
            echo "LLVM_CONFIG=$llvm_config"
            echo "LLVM_DIR=$("$llvm_config" --cmakedir)"
            echo "CMAKE_ARGS=-DPython3_EXECUTABLE=$venv/bin/python"
          } >> "$GITHUB_ENV"

      - name: Check formatting
        run: make format-check
      - name: Run clang-tidy
        run: make lint
      - name: Build and test
        run: make test CONFIG=Debug
      - name: Test with ASan and UBSan
        run: make sanitize
      - uses: actions/download-artifact@v4
        if: needs.windows-fixtures.result == 'success'
        with:
          name: windows-x64-fixtures
          path: build/fixtures/windows-x64
      - uses: actions/download-artifact@v4
        if: needs.windows-fixtures.result == 'success'
        with:
          name: windows-x64-wine-references
          path: build/reference/windows-x64/wine
      - name: Compare native execution against Wine
        id: compare
        if: needs.windows-fixtures.result == 'success'
        run: |
          status=0
          CMAKE_GENERATOR=Xcode ./tools/run-differential.sh --all --config debug --forge build-sanitize/forge || status=1
          ./tools/run-differential.sh --all --config release || status=1
          exit "$status"
      - name: Verify differential failure reports
        if: needs.windows-fixtures.result == 'success'
        run: python3 -B tests/differential/test_native_differential.py
      - name: Preserve differential reports, generated code, and diagnostics
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-differential
          path: build/differential
          if-no-files-found: warn
