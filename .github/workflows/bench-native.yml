name: Native CI benchmark

on:
  push:
    branches: [perf/ci-benchmarks]
    paths: [.github/workflows/bench-native.yml]

permissions:
  contents: read

env:
  FORGE_CI_THINLTO_CACHE: 'true'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  controls:
    if: github.event.head_commit.message == 'Measure native CI build parallelism and compiler cache reuse'
    name: dev / ${{ matrix.sample }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: unconstrained
            jobs: ''
            lto: 'false'
          - sample: three-way
            jobs: '3'
            lto: 'false'
          - sample: three-way + local ThinLTO
            jobs: '3'
            lto: 'true'
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      FORGE_CI_THINLTO_CACHE: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-setup
        with:
          presets: dev
      - name: Control build and full CTest
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-dev
          if [[ -d "$RUNNER_TEMP/forge-lto" ]]; then du -sh "$RUNNER_TEMP/forge-lto"; fi

  cold:
    if: github.event.head_commit.message == 'Measure native CI build parallelism and compiler cache reuse'
    name: dev / cold compiler cache
    runs-on: macos-26
    env:
      FORGE_CI_CCACHE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-setup
        with:
          compiler-cache: 'true'
          presets: dev
      - name: Cold build and full CTest
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-dev
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR" "$RUNNER_TEMP/forge-lto"
          tar -czf "$RUNNER_TEMP/cold-sample.tgz" build/dev/CMakeFiles/forge_core.dir/src/diagnostic.cpp.o build/dev/forge
      - uses: actions/upload-artifact@v4
        with:
          name: cold-sample
          path: ${{ runner.temp }}/cold-sample.tgz

  warm:
    if: github.event.head_commit.message == 'Measure native CI build parallelism and compiler cache reuse'
    name: dev / ${{ matrix.sample }} compiler cache
    needs: cold
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        sample: [warm, edited]
    env:
      FORGE_CI_CCACHE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Edit a single translation unit
        if: matrix.sample == 'edited'
        run: |
          echo 'extern "C" unsigned forge_benchmark_cache_version() { return 43545829u; }' >> src/diagnostic.cpp
          git -c user.name=Benchmark -c user.email=benchmark@localhost commit -am 'Change one translation unit for the compile-cache experiment'
      - uses: ./.github/actions/native-setup
        with:
          compiler-cache: 'true'
          presets: dev
      - uses: actions/download-artifact@v4
        with:
          name: cold-sample
          path: ${{ runner.temp }}
      - name: Full build and CTest from restored objects
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-dev
          ccache --show-stats --verbose
          ccache --print-stats > "$RUNNER_TEMP/ccache-stats"
          cat "$RUNNER_TEMP/ccache-stats"
          du -sh "$CCACHE_DIR" "$RUNNER_TEMP/forge-lto"
      - name: Verify cache reuse and edited object
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir "$RUNNER_TEMP/cold"
          tar -xzf "$RUNNER_TEMP/cold-sample.tgz" -C "$RUNNER_TEMP/cold"
          object=build/dev/CMakeFiles/forge_core.dir/src/diagnostic.cpp.o
          hits=$(awk '/^(direct_cache_hit|preprocessed_cache_hit)[[:space:]]/ { n += $2 } END { print n+0 }' "$RUNNER_TEMP/ccache-stats")
          misses=$(awk '$1 == "cache_miss" { print $2 }' "$RUNNER_TEMP/ccache-stats")
          echo "Cache hits: $hits; misses: $misses"
          test "$hits" -gt 0
          if [[ "$SAMPLE" == edited ]]; then
            test "$misses" -gt 0
            ! cmp -s "$object" "$RUNNER_TEMP/cold/$object" || exit 1
            nm "$object" > "$RUNNER_TEMP/symbols"
            grep -q _forge_benchmark_cache_version "$RUNNER_TEMP/symbols"
          else
            cmp "$object" "$RUNNER_TEMP/cold/$object"
          fi

  uncached-tools:
    name: dev / cold LLVM and Conan
    if: github.event.head_commit.message == 'Verify a cold LLVM and Conan setup on a clean runner'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Isolate this run's tool and package caches
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for path, key in (
              (".github/actions/llvm/action.yml", "key: forge-"),
              (".github/actions/native-setup/action.yml", "key: forge-conan-v2-"),
          ):
              file = Path(path)
              action = file.read_text()
              assert action.count(key) == 1
              file.write_text(action.replace(key, f"{key}cold-{os.environ['GITHUB_RUN_ID']}-"))
          PYTHON
          git -c user.name=Benchmark -c user.email=benchmark@localhost commit -am 'Use run-specific cache keys for a cold runner test'
      - uses: ./.github/actions/native-setup
        with:
          presets: dev
      - name: Build and execute the complete native suite offline
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip "*:*"))' \
            ./tools/test-forge.sh --native-dev

  conan-invalidation:
    name: real Conan cache key invalidation
    if: github.event.head_commit.message == 'Check Conan profile cache invalidation'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Expose the selected package-cache hit for this experiment
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          p = Path(".github/actions/native-setup/action.yml")
          text = p.read_text()
          before = '        archive="$RUNNER_TEMP/forge-packages.tgz"'
          assert text.count(before) == 1
          p.write_text(text.replace(before, '        echo "FORGE_BENCH_CONAN_HIT=$CACHE_HIT" >> "$GITHUB_ENV"\n' + before))
          PYTHON
      - name: Record the selected Conan package archive and first-party integration
        id: before
        uses: ./.github/actions/native-setup
        with:
          presets: dev
      - name: Snapshot the locked package bytes and change the checked-in profile
        run: |
          test "$FORGE_BENCH_CONAN_HIT" = true
          archive="$RUNNER_TEMP/forge-packages.tgz"
          test -s "$archive"
          conan list '*:*' --format=json > "$RUNNER_TEMP/first-packages.json"
          initial="$RUNNER_TEMP/first-cli-header-sha256"
          folder=$(conan cache path "$(python -c 'import json; x=json.load(open("conan.lock")); print(x["requires"][0].split("%")[0])')")
          test -d "$folder"
          find "$CONAN_HOME" -name CLI.hpp -type f -exec shasum -a 256 {} \; | cut -d' ' -f1 | sort > "$initial"
          test -s "$initial"
          echo '# Native cache invalidation control' >> conan/profiles/macos-arm64-appleclang
          mv "$archive" "$RUNNER_TEMP/original-forge-packages.tgz"
          mv "$CONAN_HOME" "$RUNNER_TEMP/original-forge-conan"
          mv build "$RUNNER_TEMP/original-build"
      - name: Provision with the changed profile using a fresh Conan home
        id: after
        uses: ./.github/actions/native-setup
        with:
          presets: dev
      - name: Verify locked bytes and offline reuse
        run: |
          test "$FORGE_BENCH_CONAN_HIT" != true
          conan list '*:*' --format=json > "$RUNNER_TEMP/second-packages.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def package_ids(filename):
              recipes = json.loads((root / filename).read_text())['Local Cache']
              return {(ref, rev, pid)
                      for ref, data in recipes.items()
                      for rev, package in data['revisions'].items()
                      for pid in package['packages']}
          before = package_ids('first-packages.json')
          after = package_ids('second-packages.json')
          assert before and before == after, (before, after)
          print('Verified locked Conan package IDs:', before)
          PYTHON
          find "$CONAN_HOME" -name CLI.hpp -type f -exec shasum -a 256 {} \; | cut -d' ' -f1 | sort > "$RUNNER_TEMP/second-cli-header-sha256"
          cmp "$RUNNER_TEMP/first-cli-header-sha256" "$RUNNER_TEMP/second-cli-header-sha256"
          make provision PRESET=dev CACHE_ONLY=1
