name: Provision native Forge
description: Install verified tools and generate the locked Conan integration for the selected presets
inputs:
  presets:
    description: Space-separated Forge presets
    required: true
  compiler-cache:
    description: Enable the bounded object cache for this compilation
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/llvm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-build.txt
    - name: Install the pinned build tools and function oracle
      shell: bash
      run: |
        venv="$RUNNER_TEMP/forge-python"
        python -m venv "$venv"
        "$venv/bin/python" -m pip install --only-binary=unicorn -r requirements-build.txt
        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "CMAKE_ARGS=-DPython3_EXECUTABLE=$venv/bin/python" >> "$GITHUB_ENV"
        echo "CONAN_HOME=$RUNNER_TEMP/forge-conan" >> "$GITHUB_ENV"
    - name: Identify the native toolchain
      id: toolchain
      shell: bash
      run: |
        {
          uname -sm
          sw_vers -buildVersion
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-build-version
          xcrun clang++ --version
          xcrun ld -version_details
          "$LLVM_CONFIG" --version
          cmake --version
          conan --version
        } | tee "$RUNNER_TEMP/forge-toolchain.txt"
        echo "id=$(shasum -a 256 "$RUNNER_TEMP/forge-toolchain.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        echo "restore_started=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore locked Conan packages
      id: packages
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/forge-packages.tgz
        key: forge-conan-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/**', 'requirements-build.txt', 'CMakePresets.json', 'cmake/workflow.py', '.github/actions/llvm/action.yml', '.github/actions/native-setup/action.yml') }}
    - name: Unpack the locked Conan packages
      if: steps.packages.outputs.cache-hit == 'true'
      shell: bash
      run: conan cache restore "$RUNNER_TEMP/forge-packages.tgz"
    - name: Generate the locked preset integrations
      id: provision
      env:
        CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
        PRESETS: ${{ inputs.presets }}
        RESTORE_STARTED: ${{ steps.toolchain.outputs.restore_started }}
      shell: bash
      run: |
        start=$(date +%s)
        echo "- Conan restore (cache hit: ${CACHE_HIT:-false}) took $((start - RESTORE_STARTED))s" >> "$GITHUB_STEP_SUMMARY"
        cache_only=1
        if [[ "$CACHE_HIT" != true ]]; then
          # Both native suites exercise all presets with the network disabled.
          PRESETS='dev release sanitize lint xcode'
          cache_only=0
        fi
        for preset in $PRESETS; do make provision PRESET="$preset" CACHE_ONLY="$cache_only"; done
        end=$(date +%s)
        echo "- Conan provision ($PRESETS) took $((end - start))s" >> "$GITHUB_STEP_SUMMARY"
        echo "save_started=$end" >> "$GITHUB_OUTPUT"
    - name: Archive the locked Conan packages
      if: steps.packages.outputs.cache-hit != 'true'
      shell: bash
      run: conan cache save '*:*' --no-source --file "$RUNNER_TEMP/forge-packages.tgz"
    - name: Save the locked Conan archive
      if: steps.packages.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/forge-packages.tgz
        key: ${{ steps.packages.outputs.cache-primary-key }}
    - name: Enable the runner-local ThinLTO object cache
      shell: bash
      env:
        CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
        SAVE_STARTED: ${{ steps.provision.outputs.save_started }}
      run: |
        if [[ "$CACHE_HIT" == true ]]; then
          echo "- Conan save skipped on exact cache hit" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- Conan archive and save took $(( $(date +%s) - SAVE_STARTED ))s" >> "$GITHUB_STEP_SUMMARY"
        fi
        mkdir -p "$RUNNER_TEMP/forge-lto"
        echo "LDFLAGS=-Wl,-cache_path_lto,$RUNNER_TEMP/forge-lto" >> "$GITHUB_ENV"
    - name: Install pinned ccache
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        archive=ccache-4.14.2-darwin.tar.gz
        curl --fail --location --retry 3 -o "$archive" \
          "https://github.com/ccache/ccache/releases/download/v4.14.2/$archive"
        echo "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  $archive" | shasum -a 256 -c -
        tar xzf "$archive" ccache-4.14.2-darwin/ccache
        tool="$RUNNER_TEMP/ccache-4.14.2-darwin/ccache"
        "$tool" --version
        echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
        echo "CMAKE_ARGS=$CMAKE_ARGS -DCMAKE_CXX_COMPILER_LAUNCHER=$tool" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$RUNNER_TEMP/forge-ccache" >> "$GITHUB_ENV"
        echo 'CCACHE_MAXSIZE=256M' >> "$GITHUB_ENV"
        echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
    - name: Restore compiled objects
      if: inputs.compiler-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/forge-ccache
        key: forge-ccache-v1-${{ inputs.presets }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/actions/native-setup/action.yml', '.github/actions/llvm/action.yml', 'conan.lock', 'conanfile.py', 'conan/profiles/**', 'CMakePresets.json') }}-${{ hashFiles('src/**','tests/unit/**','tests/support/**','**/CMakeLists.txt','cmake/**') }}
        restore-keys: |
          forge-ccache-v1-${{ inputs.presets }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/actions/native-setup/action.yml', '.github/actions/llvm/action.yml', 'conan.lock', 'conanfile.py', 'conan/profiles/**', 'CMakePresets.json') }}-
    - name: Reset counters for this build
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: ccache --zero-stats
